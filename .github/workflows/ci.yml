name: CI

# 触发：推送到 main、任意 PR、以及手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 测试（pytest）
        run: pytest -q

      # ------------------------------------------------------------------
      # 可选门禁：格式检查
      #
      # 本仓库尚未整体采用 black 格式化（一次 `black .` 会改动 16 个文件 /
      # 约 1583 行），所以默认不把它设为门禁，避免 CI 长期飘红。
      # 想启用就先跑一次格式化并提交，再取消下面两行的注释。
      #
      # - name: 格式检查（black）
      #   run: black --check .
      # ------------------------------------------------------------------
