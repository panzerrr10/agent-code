<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    <!-- 前端依赖全部本地化（static/vendor），断网 / 内网环境也能完整渲染 -->
    <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <!-- highlight.js 代码高亮 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/github-dark.min.css') }}">
    <script src="{{ url_for('static', filename='vendor/highlight.min.js') }}"></script>
    <!-- CodeMirror 6：本地构建的单文件包（见 web/static/vendor/README.md）-->
    <script src="{{ url_for('static', filename='vendor/codemirror.min.js') }}"></script>
    <!-- 鉴权引导：必须在任何业务脚本之前执行（注入令牌 + 包装 fetch 自动带头）-->
    <script>
        // 服务端注入的访问令牌。跨域页面读不到本页面内容，因此不会泄露；
        // 所有同源 fetch 自动带上 X-Auth-Token —— 跨域请求无法设置自定义头，CSRF 由此被切断。
        window.AUTH_TOKEN = {{ auth_token | tojson }};
        (function () {
            const _fetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                init = init || {};
                const url = (typeof input === "string") ? input : ((input && input.url) || "");
                if (url.startsWith("/") || url.startsWith(location.origin)) {
                    const headers = new Headers(init.headers || {});
                    headers.set("X-Auth-Token", window.AUTH_TOKEN || "");
                    init.headers = headers;
                }
                return _fetch(input, init);
            };
        })();

        // 导出走 fetch + Blob：导航式下载带不了自定义请求头，会 401
        async function downloadExport(fmt, fallbackName) {
            try {
                const res = await fetch(`/export/${currentSessionId}?format=${fmt}`);
                if (!res.ok) {
                    alert(`导出失败（HTTP ${res.status}）`);
                    return;
                }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${fallbackName || "对话记录"}.${fmt}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("导出失败：" + e.message);
            }
        }
    </script>

    <!-- ============================================================
         样式：按「层」拆成 6 个文件
         ------------------------------------------------------------
         级联顺序就是加载顺序，**不要调换**：
           01 基础 → 02 组件 → 03 弹窗 → 04 面板 → 05 文件面板 → 06 主题
         06 是设计尺度与亮暗配色的覆盖层，它必须最后加载才生效。
         ============================================================ -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/01-base.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/06-theme.css') }}">
</head>

         顺序**，与原单文件从上到下逐段执行的语义完全一致。
         新增功能请加到对应文件，不要再往 index.html 里写内联脚本。
         ============================================================ -->
