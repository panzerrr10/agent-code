# 本文件只放工具配置（pytest / black / ruff）。
# 运行依赖统一在 requirements.txt / requirements-dev.txt 里声明，避免两处漂移。

[tool.pytest.ini_options]
# 代码与测试都在 src/ 下（src/ 会被 pytest 自动加入 sys.path，
# 因此测试里的 `import db` / `import tools` 这类顶层导入照旧可用）
testpaths = ["src/tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "demos", "resume_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 交由 black 处理行宽，其余保持默认
ignore = ["E501"]
